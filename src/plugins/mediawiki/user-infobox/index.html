<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Infobox</title>

    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Noto Sans SC', 'Noto Sans CJK SC', 'HYWenHei', 'Microsoft YaHei',
          Roboto, sans-serif;
        color: #1f2329;
        display: inline-block;
        -webkit-font-smoothing: antialiased;
      }

      /* QQ rounds image corners itself; the shot is a plain rectangle (JPEG, no alpha). */
      #user-infobox {
        --hue: 220;
        width: 360px;
        background: #fff;
      }

      .banner {
        height: 72px;
        background:
          radial-gradient(
            120% 140% at 100% 0%,
            hsl(calc(var(--hue) + 40) 80% 82%) 0%,
            transparent 60%
          ),
          linear-gradient(
            135deg,
            hsl(var(--hue) 70% 62%) 0%,
            hsl(calc(var(--hue) + 25) 65% 72%) 100%
          );
      }

      .head {
        padding: 0 20px;
        display: flex;
        align-items: flex-end;
        gap: 14px;
        margin-top: -32px;
      }
      .avatar {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        flex: none;
        border: 4px solid #fff;
        background: hsl(var(--hue) 45% 92%);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 700;
        color: hsl(var(--hue) 45% 45%);
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .ident {
        min-width: 0;
        padding-bottom: 4px;
      }
      .name {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.2;
        word-break: break-all;
      }
      .sub {
        margin-top: 3px;
        font-size: 12px;
        color: #8f959e;
        font-variant-numeric: tabular-nums;
      }

      .groups {
        padding: 12px 20px 0;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .tag {
        font-size: 11.5px;
        line-height: 1;
        padding: 5px 9px;
        border-radius: 6px;
        background: hsl(var(--hue) 70% 95%);
        color: hsl(var(--hue) 55% 38%);
        font-weight: 600;
      }

      .blocked {
        margin: 14px 20px 0;
        padding: 9px 12px;
        border-radius: 8px;
        background: #fff1f0;
        border: 1px solid #ffd6d3;
        font-size: 12.5px;
        line-height: 1.55;
        color: #a8071a;
      }
      .blocked b {
        font-weight: 700;
      }

      .stats {
        margin: 16px 20px 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .stat {
        background: #f5f6f8;
        border-radius: 10px;
        padding: 10px 12px;
      }
      .stat .l {
        font-size: 11.5px;
        color: #8f959e;
      }
      .stat .n {
        margin-top: 2px;
        font-size: 18px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .stat .n small {
        font-size: 12px;
        font-weight: 500;
        color: #646a73;
        margin-left: 2px;
      }

      .contribs {
        margin: 16px 20px 0;
      }
      .contribs .hd {
        font-size: 12px;
        font-weight: 600;
        color: #646a73;
        margin-bottom: 4px;
      }
      .contribs .row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 7px 0;
        font-size: 13px;
      }
      .contribs .row + .row {
        border-top: 1px dashed #e8eaed;
      }
      .contribs .pg {
        flex: 1;
        min-width: 0;
        color: #1f2329;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .contribs .ts {
        flex: none;
        color: #8f959e;
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }

      /* Source line (sitename · page URL) so a forwarded card stays traceable; bare spacer when empty */
      .foot {
        margin-top: 18px;
      }
      .foot:not(:empty) {
        margin-top: 16px;
        padding: 9px 20px 11px;
        border-top: 1px solid #eef0f3;
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 11px;
        color: #8f959e;
        white-space: nowrap;
      }
      .foot .site {
        flex: none;
        font-weight: 600;
        color: #646a73;
      }
      .foot .site + .link::before {
        content: '·';
        margin-right: 6px;
      }
      .foot .link {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="user-infobox">
      <div class="banner"></div>
      <div class="head">
        <div class="avatar"></div>
        <div class="ident">
          <div class="name"></div>
          <div class="sub"></div>
        </div>
      </div>

      <div class="groups hidden"></div>
      <div class="blocked hidden"></div>

      <div class="stats">
        <div class="stat">
          <div class="l">编辑数</div>
          <div class="n" data-stat="editcount"></div>
        </div>
        <div class="stat">
          <div class="l">注册于</div>
          <div class="n" data-stat="registration"></div>
        </div>
      </div>

      <div class="contribs hidden">
        <div class="hd">最近编辑</div>
        <div class="rows"></div>
      </div>
      <div class="foot"></div>
    </div>

    <script>
      const data = JSON.parse(
        new URL(location.href).searchParams.get('data') || '{}'
      )

      const $ = (sel) => document.querySelector(sel)
      const show = (el) => el.classList.remove('hidden')
      const el = (tag, cls, text) => {
        const e = document.createElement(tag)
        if (cls) e.className = cls
        if (text != null) e.textContent = text
        return e
      }

      const setHue = (hue) =>
        $('#user-infobox').style.setProperty('--hue', String(Math.round(hue)))

      // Default accent: stable per-user hash, so avatarless users still differ
      let h = 0
      for (const ch of String(data.name || ''))
        h = (h * 31 + ch.codePointAt(0)) >>> 0
      setHue(h % 360)

      /**
       * Dominant hue of an avatar: saturation²-weighted circular mean over a 16×16 downsample.
       * Transparency is flattened onto white, and near-white / near-black pixels are skipped,
       * so plain or transparent backgrounds don't pull the hue. Returns null for (near-)grayscale
       * avatars. Needs a same-origin image — the avatar arrives as a data: URI for this reason.
       */
      function avatarHue(img) {
        const N = 16
        const canvas = document.createElement('canvas')
        canvas.width = canvas.height = N
        const g = canvas.getContext('2d')
        g.fillStyle = '#fff'
        g.fillRect(0, 0, N, N)
        g.drawImage(img, 0, 0, N, N)
        const px = g.getImageData(0, 0, N, N).data
        let x = 0
        let y = 0
        let colored = 0
        for (let i = 0; i < px.length; i += 4) {
          const r = px[i] / 255
          const gr = px[i + 1] / 255
          const b = px[i + 2] / 255
          const max = Math.max(r, gr, b)
          const min = Math.min(r, gr, b)
          const l = (max + min) / 2
          const d = max - min
          if (d === 0 || l > 0.92 || l < 0.08) continue
          const s = d / (1 - Math.abs(2 * l - 1))
          if (s < 0.15) continue
          const hue =
            max === r
              ? ((gr - b) / d + 6) % 6
              : max === gr
                ? (b - r) / d + 2
                : (r - gr) / d + 4
          const rad = (hue * Math.PI) / 3
          x += Math.cos(rad) * s * s
          y += Math.sin(rad) * s * s
          colored++
        }
        if (colored < N * N * 0.05) return null
        return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360
      }

      const foot = $('.foot')
      if (data.sitename) foot.append(el('span', 'site', data.sitename))
      if (data.link) foot.append(el('span', 'link', data.link))

      $('.name').textContent = data.name || ''
      $('.sub').textContent = data.userid != null ? `UID ${data.userid}` : ''

      // Avatar: initial letter unless the inlined image decodes. The <img> load
      // delays window.onload, so the hue lands before the screenshot is taken.
      const avatar = $('.avatar')
      avatar.textContent = Array.from(String(data.name || '?'))[0].toUpperCase()
      if (data.avatar) {
        const img = new Image()
        img.onload = () => {
          avatar.replaceChildren(img)
          const hue = avatarHue(img)
          if (hue != null) setHue(hue)
        }
        img.src = data.avatar
      }

      const groups = Array.isArray(data.groups) ? data.groups : []
      if (groups.length) {
        const box = $('.groups')
        groups.forEach((g) => box.appendChild(el('span', 'tag', g)))
        show(box)
      }

      if (data.block) {
        const box = $('.blocked')
        box.append(
          el('b', null, '已封禁'),
          ` · 由 ${data.block.by} 执行，期限 ${data.block.expiry}`
        )
        if (data.block.reason) {
          box.append(el('br'), `理由：${data.block.reason}`)
        }
        show(box)
      }

      $('[data-stat="editcount"]').textContent = (
        data.editcount ?? 0
      ).toLocaleString('en-US')
      $('[data-stat="registration"]').textContent = data.registration || '—'

      const contribs = Array.isArray(data.contribs) ? data.contribs : []
      if (contribs.length) {
        const rows = $('.contribs .rows')
        contribs.forEach((c) => {
          const row = el('div', 'row')
          row.append(el('span', 'pg', c.title), el('span', 'ts', c.time))
          rows.appendChild(row)
        })
        show($('.contribs'))
      }
    </script>
  </body>
</html>
