<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Infobox</title>

    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Noto Sans SC', 'Noto Sans CJK SC', 'HYWenHei', 'Microsoft YaHei',
          Roboto, sans-serif;
        color: #1f2329;
        display: inline-block;
        -webkit-font-smoothing: antialiased;
      }

      /* QQ rounds image corners itself; the shot is a plain rectangle (JPEG, no alpha). */
      #user-infobox {
        --hue: 220;
        width: 360px;
        background: #fff;
      }

      .banner {
        height: 72px;
        padding: 12px 16px;
        background:
          radial-gradient(
            120% 140% at 100% 0%,
            hsl(calc(var(--hue) + 40) 80% 82%) 0%,
            transparent 60%
          ),
          linear-gradient(
            135deg,
            hsl(var(--hue) 70% 62%) 0%,
            hsl(calc(var(--hue) + 25) 65% 72%) 100%
          );
      }

      .site {
        display: inline-block;
        max-width: 100%;
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.16);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.4;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .head {
        padding: 0 20px;
        display: flex;
        align-items: flex-end;
        gap: 14px;
        margin-top: -32px;
      }
      .avatar {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        flex: none;
        border: 4px solid #fff;
        background: hsl(var(--hue) 45% 92%);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 700;
        color: hsl(var(--hue) 45% 45%);
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .ident {
        min-width: 0;
        padding-bottom: 4px;
      }
      .name {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.2;
        word-break: break-all;
      }
      .sub {
        margin-top: 3px;
        font-size: 12px;
        color: #8f959e;
        font-variant-numeric: tabular-nums;
      }

      .groups {
        padding: 12px 20px 0;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .tag {
        font-size: 11.5px;
        line-height: 1;
        padding: 5px 9px;
        border-radius: 6px;
        background: hsl(var(--hue) 70% 95%);
        color: hsl(var(--hue) 55% 38%);
        font-weight: 600;
      }

      .blocked {
        margin: 14px 20px 0;
        padding: 9px 12px;
        border-radius: 8px;
        background: #fff1f0;
        border: 1px solid #ffd6d3;
        font-size: 12.5px;
        line-height: 1.55;
        color: #a8071a;
      }
      .blocked b {
        font-weight: 700;
      }

      .stats {
        margin: 16px 20px 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .stat {
        background: #f5f6f8;
        border-radius: 10px;
        padding: 10px 12px;
      }
      .stat .l {
        font-size: 11.5px;
        color: #8f959e;
      }
      .stat .n {
        margin-top: 2px;
        font-size: 18px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .stat .n small {
        font-size: 12px;
        font-weight: 500;
        color: #646a73;
        margin-left: 2px;
      }

      .contribs {
        margin: 16px 20px 0;
      }
      .contribs .hd {
        font-size: 12px;
        font-weight: 600;
        color: #646a73;
        margin-bottom: 4px;
      }
      .contribs .row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 7px 0;
        font-size: 13px;
      }
      .contribs .row + .row {
        border-top: 1px dashed #e8eaed;
      }
      .contribs .pg {
        flex: 1;
        min-width: 0;
        color: #1f2329;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .contribs .ts {
        flex: none;
        color: #8f959e;
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }

      /* Bare spacer when there is no link; a page-URL footer once filled */
      .foot {
        margin-top: 18px;
      }
      .foot:not(:empty) {
        margin-top: 16px;
        padding: 9px 20px 11px;
        border-top: 1px solid #eef0f3;
        font-size: 11px;
        color: #8f959e;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="user-infobox">
      <div class="banner"><span class="site hidden"></span></div>
      <div class="head">
        <div class="avatar"></div>
        <div class="ident">
          <div class="name"></div>
          <div class="sub"></div>
        </div>
      </div>

      <div class="groups hidden"></div>
      <div class="blocked hidden"></div>

      <div class="stats">
        <div class="stat">
          <div class="l">编辑数</div>
          <div class="n" data-stat="editcount"></div>
        </div>
        <div class="stat">
          <div class="l">注册于</div>
          <div class="n" data-stat="registration"></div>
        </div>
      </div>

      <div class="contribs hidden">
        <div class="hd">最近编辑</div>
        <div class="rows"></div>
      </div>
      <div class="foot"></div>
    </div>

    <script>
      const data = JSON.parse(
        new URL(location.href).searchParams.get('data') || '{}'
      )

      const $ = (sel) => document.querySelector(sel)
      const show = (el) => el.classList.remove('hidden')
      const el = (tag, cls, text) => {
        const e = document.createElement(tag)
        if (cls) e.className = cls
        if (text != null) e.textContent = text
        return e
      }

      // Stable per-user accent hue so different users get different banners
      let h = 0
      for (const ch of String(data.name || ''))
        h = (h * 31 + ch.codePointAt(0)) >>> 0
      $('#user-infobox').style.setProperty('--hue', String(h % 360))

      if (data.sitename) {
        $('.site').textContent = data.sitename
        show($('.site'))
      }
      if (data.link) $('.foot').textContent = data.link

      $('.name').textContent = data.name || ''
      $('.sub').textContent = data.userid != null ? `UID ${data.userid}` : ''

      // Avatar: initial letter until the remote image loads; a failed load keeps the initial
      const avatar = $('.avatar')
      avatar.textContent = Array.from(String(data.name || '?'))[0].toUpperCase()
      if (data.avatar) {
        const img = new Image()
        img.onload = () => avatar.replaceChildren(img)
        img.src = data.avatar
      }

      const groups = Array.isArray(data.groups) ? data.groups : []
      if (groups.length) {
        const box = $('.groups')
        groups.forEach((g) => box.appendChild(el('span', 'tag', g)))
        show(box)
      }

      if (data.block) {
        const box = $('.blocked')
        box.append(
          el('b', null, '已封禁'),
          ` · 由 ${data.block.by} 执行，期限 ${data.block.expiry}`
        )
        if (data.block.reason) {
          box.append(el('br'), `理由：${data.block.reason}`)
        }
        show(box)
      }

      $('[data-stat="editcount"]').textContent = (
        data.editcount ?? 0
      ).toLocaleString('en-US')
      $('[data-stat="registration"]').textContent = data.registration || '—'

      const contribs = Array.isArray(data.contribs) ? data.contribs : []
      if (contribs.length) {
        const rows = $('.contribs .rows')
        contribs.forEach((c) => {
          const row = el('div', 'row')
          row.append(el('span', 'pg', c.title), el('span', 'ts', c.time))
          rows.appendChild(row)
        })
        show($('.contribs'))
      }
    </script>
  </body>
</html>
