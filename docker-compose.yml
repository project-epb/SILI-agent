name: sili

services:
  core:
    container_name: sili-core
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./docker/sili-core.dockerfile
    # 启动流程见 scripts/docker-entrypoint.sh（镜像 CMD），本地想要热重载可用
    # docker-compose.override.yml 覆盖 command
    mem_limit: 1.5g
    restart: unless-stopped
    networks:
      sili-network:
        aliases:
          - core.sili.local
    # 生产环境使用 caddy 反代，并带有路径拦截
    # 勿暴露此端口到公网，否则攻击者可伪造消息或控制 bot 发言
    # ports:
    #   - '3100:3100'
    volumes:
      # 主要的 Node.js 项目文件
      - ./src/:/app/src
      - ./package.json:/app/package.json
      - ./bun.lock:/app/bun.lock
      - ./tsconfig.json:/app/tsconfig.json
      - ./plugins/:/app/plugins
      - ./.npmrc:/app/.npmrc
      - ./.env:/app/.env
      # 只读挂 .git 供 version 指令读取当前 commit hash（宿主 pull 后实时可见）
      - ./.git:/app/.git:ro
      # koishi自带的data文件夹（comfyui workflows/guides 放 .volumns/core/comfyui/）
      - ./.volumns/core:/app/data
      # node_modules 与 Chrome 本体都不在镜像里，由 entrypoint 按 bun.lock /
      # puppeteer 版本填充到这两个卷。必须是 named 卷：匿名卷每次容器重建都会
      # 遗留一份几百 MB 的孤儿，且复用旧卷时会遮蔽镜像/依赖的更新。
      - sili_node_modules:/app/node_modules
      - sili_puppeteer_cache:/root/.cache/puppeteer
    depends_on:
      - mongo

  mongo:
    container_name: sili-mongo
    image: mongo:8
    mem_limit: 256m
    networks:
      sili-network:
        aliases:
          - mongo.sili.local
    restart: unless-stopped
    ports:
      # 我们暴露此端口到宿主机，这样就能通过 MongoDB Compase 等应用连接它
      - '127.0.0.1:27017:27017'
    # 暂时不设密码，注意配置防火墙，不能将此端口暴露到公网
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: ${DB_MONGO_USER}
    #   MONGO_INITDB_ROOT_PASSWORD: ${DB_MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db

  # https://github.com/NapNeko/NapCat-Docker
  napcat:
    container_name: sili-napcat
    image: mlikiowa/napcat-docker:latest
    networks:
      sili-network:
        aliases:
          - napcat.sili.local
    restart: unless-stopped
    # environment:
    #   - NAPCAT_UID=${NAPCAT_UID:-1000}
    #   - NAPCAT_GID=${NAPCAT_GID:-1000}
    mem_limit: 1g
    ports:
      - '127.0.0.1:3080:6099'
    volumes:
      - qqnt_data:/app/.config/QQ
      - ./.volumns/napcat:/app/napcat/config

networks:
  sili-network:
    name: sili-network
    external: true

volumes:
  sili_node_modules:
    name: sili_node_modules
  sili_puppeteer_cache:
    name: sili_puppeteer_cache
  mongo_data:
    name: sili_mongo_data
  qqnt_data:
    name: sili_qqnt_data
